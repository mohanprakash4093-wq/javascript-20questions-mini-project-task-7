<!DOCTYPE html>
<html>
<head>
    <title>Question 10 - Product Title Character Count</title>
</head>
<body>

    <h1>Men's Clothing Product Titles and Character Count</h1>

    <div id="products"></div>

    <script>

        fetch("https://fakestoreapi.com/products/category/men's%20clothing")
        .then(response => response.json())
        .then(data => {

            let products = document.querySelector("#products");

            data.forEach(product => {

                let div = document.createElement("div");

                div.innerHTML = `
                    <h2>${product.title}</h2>
                    <p>Total Characters: ${product.title.length}</p>
                `;

                products.appendChild(div);

            });

        })
        .catch(error => {
            console.log("Error:", error);
        });

    </script>

</body>
</html>
