<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL MENS WEAR</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b0f19, #1a2a40);
            color: #f0f0f0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #111e38, #1d3557);
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid #1f3a60;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .api {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* API Errors in Red */
        .api .error {
            color: #ff6b6b;
            background-color: rgba(217, 83, 79, 0.1);
            padding: 10px;
            border: 1px solid #d9534f;
            border-radius: 4px;
            display: inline-block;
        }

        .api .status {
            color: #4cd137;
            padding: 8px;
        }

        .product-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            flex-grow: 1;
            width: 100%;
        }

        /* Separate Card for Every Product */
        .card {
            background: #131c2e;
            color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #1f314d;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.2);
            border-color: #2a5298;
        }

        .product-id {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #2a5298;
            color: white;
            padding: 4px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
            font-weight: bold;
            z-index: 2;
        }

        .img-container {
            width: 100%;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            margin-top: 15px;
            background: #ffffff;
            border-radius: 6px;
            padding: 10px;
        }

        .card img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .product-price {
            font-size: 1.25rem;
            color: #4da6ff;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .product-description {
            font-size: 0.9rem;
            color: #b0c4de;
            line-height: 1.4;
            margin-top: auto;
        }

        /* Footer Section for Location, Contact Number, and Email */
        footer {
            margin-top: 40px;
            background: #0b1320;
            border-top: 1px solid #1f314d;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            color: #b0c4de;
        }

        footer h3 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer-info {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 0.95rem;
        }

        .footer-info div {
            margin: 5px 10px;
        }

        .footer-info span {
            color: #4da6ff;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>GLOBAL MENS WEAR</h1>
    </header>

    <!-- Container for API Status & Red Errors -->
    <div class="api"></div>

    <!-- Product Grid Container -->
    <div class="product-container"></div>

    <!-- Footer with Location, Contact Number, and Email ID -->
    <footer>
        <h3>Global Mens Wear Store</h3>
        <div class="footer-info">
            <div>📍 <span>Location:</span> 123 Fashion Street, Anna Salai, Chennai, India</div>
            <div>📞 <span>Contact:</span> +91 98765 43210</div>
            <div>✉️ <span>Email:</span> support@globalmenswear.com</div>
        </div>
    </footer>

    <script>
        const apiContainer = document.querySelector('.api');
        const productContainer = document.querySelector('.product-container');

        // Fetching data from API using allowed rules strictly
        fetch('https://fakestoreapi.com/products/category/men\'s clothing')
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('Network response was not ok: ' + response.statusText);
                }
                return response.json();
            })
            .then(function(products) {
                products.forEach(function(product, index) {
                    // Custom override for product ID 1 with a working image link
                    if (product.id === 1) {
                        product.title = "Mens Formal Cotton Solid Shirt";
                        product.price = 45.99;
                        product.description = "Classic fit long-sleeve cotton formal shirt for men, comfortable for all-day wear and office meetings.";
                        product.image = "https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=500";
                    }

                    // Title limited to 50 characters using slice()
                    const limitedTitle = product.title.slice(0, 50);
                    
                    // Description limited to 100 characters using slice()
                    const limitedDescription = product.description.slice(0, 100);

                    // Creating a separate card for every product
                    const card = document.createElement('div');
                    card.className = 'card';

                    // Inserting Product ID, Title, Price, Description, and Image
                    card.innerHTML = `
                        <span class="product-id">ID: ${product.id}</span>
                        <div class="img-container">
                            <img src="${product.image}" alt="${limitedTitle}">
                        </div>
                        <div class="card-content">
                            <h2 class="product-title">${limitedTitle}</h2>
                            <div class="product-price">$${product.price}</div>
                            <p class="product-description">${limitedDescription}...</p>
                        </div>
                    `;

                    productContainer.appendChild(card);
                });
            })
            .catch(function(error) {
                // Display API errors in red inside .api
                apiContainer.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            })
            .finally(function() {
                // Display "API request completed" using .finally()
                const statusMessage = document.createElement('div');
                statusMessage.className = 'status';
                statusMessage.innerHTML = 'API request completed';
                apiContainer.appendChild(statusMessage);
            });
    </script>
</body>
</html>
