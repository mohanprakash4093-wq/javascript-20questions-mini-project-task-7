<!DOCTYPE html>
<html>
<head>
    <title>Question 19 - API Loading Message</title>
</head>
<body>

    <h1>API Data Loading</h1>

    <div class="api">Loading...</div>

    <div id="products"></div>

    <script>

        let api = document.querySelector(".api");

        api.innerHTML = "Loading...";

        fetch("https://fakestoreapi.com/products/category/men's%20clothing")
        .then(response => response.json())
        .then(data => {

            api.innerHTML = "API data successfully loaded!";

            let products = document.querySelector("#products");

            data.forEach(product => {

                let heading = document.createElement("h2");

                heading.innerHTML = product.title;

                products.appendChild(heading);

            });

        })
        .catch(error => {

            api.innerHTML = "Error loading API data";

            console.log("Error:", error);

        });

    </script>

</body>
</html>
